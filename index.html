<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fidget Value</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Fidget Value</h1>
    <p>Register, value, and track your fidgets.</p>
  </header>

  <main id="homePage">
    <section class="video-section">
      <h2>Classic Videos</h2>
      <div class="video-box">Add your TikTok/video here</div>
      <div class="video-box">Add your TikTok/video here</div>
    </section>

    <section>
      <h2>Registered Fidgets</h2>
      <div id="fidgetList" class="fidget-grid"></div>
    </section>
  </main>

  <main id="uploadPage" class="hidden">
    <button class="back-btn" onclick="showHome()">← Back</button>
    <h2>Upload Fidget</h2>

    <form id="fidgetForm">
      <input id="name" placeholder="Name: Caro's green mochi turtle" required />
      <textarea id="description" placeholder="Description"></textarea>
      <input id="color" placeholder="Color" />
      <input id="size" placeholder="Estimated size: small, medium, jumbo" />

      <select id="rarity" required>
        <option value="">Choose rarity</option>
        <option>Common</option>
        <option>Uncommon</option>
        <option>Rare</option>
        <option>Ultra Rare</option>
        <option>Legendary</option>
      </select>

      <select id="status" required>
        <option value="">Choose status</option>
        <option>Brand New</option>
        <option>Unused</option>
        <option>Used</option>
        <option>Damaged</option>
      </select>

      <input id="image" type="file" accept="image/*" required />

      <button type="submit">Upload</button>
    </form>

    <div id="uploadMessage" class="upload-message hidden">
      Uploading to the website...
    </div>
  </main>

  <button class="plus-btn" onclick="showUpload()">+</button>

  <script src="script.js"></script>
</body>
</html>
